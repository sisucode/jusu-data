<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" fill="none">
  <defs>
    <filter id="redGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="320" height="140" rx="12" fill="#020617"/>
  <!-- Outer track -->
  <ellipse cx="160" cy="70" rx="140" ry="48" fill="none" stroke="#334155" stroke-width="10"/>
  <!-- Inner track -->
  <ellipse cx="160" cy="70" rx="110" ry="30" fill="none" stroke="#1e293b" stroke-width="6"/>
  <!-- Short home stretch (right side) highlighted -->
  <path d="M 270 42 Q 300 70 270 98" fill="none" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" filter="url(#redGlow)"/>
  <!-- Start/finish line -->
  <line x1="270" y1="38" x2="270" y2="102" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- Labels -->
  <text x="160" y="22" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">GÄVLE · 1000 m</text>
  <text x="285" y="30" text-anchor="middle" fill="#f43f5e" font-family="monospace" font-size="10" font-weight="bold">178 m</text>
  <text x="285" y="118" text-anchor="middle" fill="#f43f5e" font-family="monospace" font-size="9">SHORT STRETCH</text>
</svg>
